{% extends "main.html" %}
{% load static %}

{% block extra_head %}
<link rel="stylesheet" href="{% static 'style/items.css' %}">
{% endblock %}

{% block content %}

    <div class="items-container">
        <h1 class="page-title">لیست آیتم‌ها</h1>

        <div class="item-search">
            <input
                type="text"
                name="q"
                placeholder="جستجوی آیتم..."
                hx-get="{% url 'ItemSearch' %}"
                hx-trigger="keyup changed delay:300ms"
                hx-target="#items-results"
                hx-swap="innerHTML"
                autocomplete="off"
            >
        </div>

        <div id="items-results">
            {% include "partials/item_sections.html" %}
        </div>
    </div>

    <!-- htmx محتوای مودال جزئیات آیتم رو با کلیک روی هر کارت، اینجا لود می‌کنه -->
    <div id="item-modal-root"></div>

{% endblock content %}

{% block extra_js %}
<script>
    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') {
            document.getElementById('item-modal-root').innerHTML = '';
        }
    });
</script>
{% endblock %}
