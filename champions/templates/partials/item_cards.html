{% for item in items %}

    <button
        type="button"
        class="item-card"

        hx-get="{% url 'ItemDetail' item.slug %}"
        hx-target="#item-modal"
        hx-swap="innerHTML"
    >

        <div class="item-card-image">

            {% if item.image_url %}

                <img
                    src="{{ item.image_url }}"
                    alt="{{ item.name }}"
                    loading="lazy"
                >

            {% else %}

                <div class="item-image-placeholder">
                    بدون تصویر
                </div>

            {% endif %}

        </div>


        <div class="item-card-content">

            <h2 class="item-card-name">
                {{ item.name }}
            </h2>

            <div class="item-card-price">
                {{ item.price }} Gold
            </div>

        </div>

    </button>

{% empty %}

    <p class="no-items">
        هیچ آیتمی یافت نشد.
    </p>

{% endfor %}
