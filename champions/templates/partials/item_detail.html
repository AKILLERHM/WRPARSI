<div class="item-modal-backdrop">

    <section
        class="item-detail-panel"
        role="dialog"
        aria-modal="true"
        aria-label="جزئیات آیتم"
    >

        <div class="item-detail-image">

            {% if item.image_url %}

                <img
                    src="{{ item.image_url }}"
                    alt="{{ item.name }}"
                >

            {% else %}

                <div class="item-image-placeholder">
                    بدون تصویر
                </div>

            {% endif %}

        </div>


        <div class="item-detail-content">

            <h2 class="item-detail-name">
                {{ item.name }}
            </h2>


            <div class="item-detail-price">
                قیمت: {{ item.price }} Gold
            </div>


            <p class="item-detail-description">
                {{ item.description }}
            </p>


            <button
                type="button"
                class="item-close-button"
                onclick="this.closest('.item-modal-backdrop').remove()"
            >
                بستن
            </button>

        </div>

    </section>

</div>
