{% for item_type in item_types %}
    {% with type_items=item_type.items.all %}
        {% if type_items %}
        <section class="item-type-section">
            <h2 class="item-type-section__title">{{ item_type.get_code_display }}</h2>
            <div class="item-grid">
                {% for item in type_items %}
                    {% include "partials/item_card.html" %}
                {% endfor %}
            </div>
        </section>
        {% endif %}
    {% endwith %}
{% empty %}
    <p>هیچ نوع آیتمی تعریف نشده</p>
{% endfor %}
