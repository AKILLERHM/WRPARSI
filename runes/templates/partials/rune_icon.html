<div class="rune-icon"
     hx-get="{% url 'RuneDetail' rune.pk %}"
     hx-target="#rune-modal-root"
     hx-swap="innerHTML"
     hx-trigger="click, keyup[key=='Enter']"
     role="button"
     tabindex="0"
     title="{{ rune.name }}">
    {% if rune.img_url %}
        <img src="{{ rune.img_url }}" alt="{{ rune.name }}">
    {% endif %}
</div>
